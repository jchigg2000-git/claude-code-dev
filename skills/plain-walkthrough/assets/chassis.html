<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F9F6F4">
<meta name="description" content="{{DESCRIPTION}}">
<meta name="plain-allow" content="{{ALLOW}}">
<title>{{TITLE}}</title>
<script>
  // Resolve the theme before first paint: a saved choice wins, otherwise follow the system.
  (function () {
    var p = 'system';
    try { p = localStorage.getItem('{{THEME_KEY}}') || 'system'; } catch (e) {}
    if (p !== 'light' && p !== 'dark') p = 'system';
    var dark = p === 'dark' || (p === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var r = document.documentElement;
    r.setAttribute('data-theme', dark ? 'dark' : 'light');
    r.setAttribute('data-theme-pref', p);
  })();
</script>
<style>
  /* tokens: light first, dark second; both themes must keep 4.5:1 text contrast */
  :root{
    color-scheme: light;
    --bg:#F9F6F4; --panel:#FFFFFF; --panel-2:#F4F0EB;
    --line:#E4DED7; --line-strong:#C9C1B8;
    --text:#162844; --text-2:#3B495D; --muted:#5C6673;
    --accent:#467871; --accent-ink:#33605A; --accent-soft:rgba(70,120,113,0.08);
    --on-accent:#FFFFFF; --ok:#2E8540; --warn:#B86E00; --bad:#C4382F; --on-bad:#FFFFFF; --prop:#8A5A00;
    --nbx:#162844; --nbx-t:#F9F6F4;
    --sans:"Avenir Next", Avenir, "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#061B32; --panel:#0B2340; --panel-2:#0E2947;
    --line:#1E3A5C; --line-strong:#35557A;
    --text:#F9F6F4; --text-2:#C3CEDB; --muted:#95A6BA;
    --accent:#64BFB5; --accent-ink:#8ED5CC; --accent-soft:rgba(100,191,181,0.10);
    --on-accent:#061B32; --ok:#5CC96B; --warn:#F0A640; --bad:#F2685D; --on-bad:#061B32; --prop:#F0A640;
    --nbx:#1F4870;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]){
      color-scheme: dark;
      --bg:#061B32; --panel:#0B2340; --panel-2:#0E2947;
      --line:#1E3A5C; --line-strong:#35557A;
      --text:#F9F6F4; --text-2:#C3CEDB; --muted:#95A6BA;
      --accent:#64BFB5; --accent-ink:#8ED5CC; --accent-soft:rgba(100,191,181,0.10);
      --on-accent:#061B32; --ok:#5CC96B; --warn:#F0A640; --bad:#F2685D; --on-bad:#061B32; --prop:#F0A640;
      --nbx:#1F4870;
    }
  }

  /* base */
  *{ box-sizing:border-box; }
  html{ background:var(--bg); }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:18px; line-height:1.6; }
  .wrap{ width:min(100% - 32px, 1040px); margin-inline:auto; }
  h1,h2,h3,h4{ margin:0; color:var(--text); line-height:1.2; }
  h1{ font-size:44px; font-weight:800; }
  h2{ font-size:32px; font-weight:800; }
  h3{ font-size:22px; font-weight:700; margin-top:32px; }
  p{ margin:0 0 16px; max-width:70ch; }
  b,strong{ font-weight:800; }
  a{ color:var(--accent-ink); }
  .sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  a:focus-visible, button:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
  code{ font-family:var(--mono); font-size:0.9em; color:var(--text); border-bottom:2px solid var(--line-strong); }
  dfn{ font-style:normal; font-weight:800; text-decoration:underline; text-decoration-color:var(--accent); text-decoration-thickness:3px; text-underline-offset:3px; }

  /* masthead */
  .mast{ border-bottom:2px solid var(--text); background:var(--panel); }
  .mast-in{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 20px; padding:12px 0; }
  .brand{ display:inline-flex; align-items:center; gap:10px; color:var(--text); text-decoration:none; font-weight:800; font-size:19px; white-space:nowrap; }
  .theme{ margin-left:auto; display:flex; gap:6px; }
  .theme button{ display:grid; place-items:center; width:44px; height:44px; border:2px solid var(--line-strong); background:var(--bg); color:var(--muted); cursor:pointer; padding:0; border-radius:0; }
  .theme button svg{ width:22px; height:22px; }
  .theme button[aria-pressed="true"]{ border-color:var(--text); color:var(--text); background:var(--panel-2); }

  /* hero and sections */
  .hero{ padding:44px 0 8px; }
  .kicker{ font-size:15px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--accent-ink); margin-bottom:12px; }
  .lede{ font-size:20px; max-width:64ch; margin-top:18px; }
  section.sec{ padding:56px 0 0; }
  .sh{ display:flex; align-items:center; gap:16px; margin-bottom:8px; }
  .sn{ display:grid; place-items:center; width:36px; height:36px; flex:none; background:var(--text); color:var(--bg); font-weight:800; font-size:20px; }
  .sub{ font-size:18px; color:var(--text-2); margin:0 0 16px; max-width:70ch; }

  /* figures */
  figure.fig{ margin:20px 0 0; border:2px solid var(--text); background:var(--panel); }
  .fig-scroll{ overflow-x:auto; padding:14px 12px 10px; }
  .fig-scroll:focus-visible{ outline:3px solid var(--accent); outline-offset:-3px; }
  figcaption{ border-top:2px solid var(--text); padding:12px 18px; font-size:16px; color:var(--text-2); line-height:1.5; }
  figcaption b{ color:var(--text); }
  .strip{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); border-top:2px solid var(--text); }
  .cell{ padding:12px 16px 12px; border-left:2px solid var(--text); font-size:16px; line-height:1.45; }
  .cell:first-child{ border-left:0; }
  .cell h4{ font-size:15px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:6px; }
  .cell ul{ margin:0; padding-left:20px; }
  .cell li{ margin:0 0 4px; }
  .cell.kept{ border-top:5px solid var(--text); }
  .cell.rebuilt{ border-top:5px solid var(--accent); }
  .cell.rebuilt h4{ color:var(--accent-ink); }
  .cell.asked{ border-top:5px dashed var(--muted); }
  @media (max-width:820px){ .strip{ grid-template-columns:1fr; } .cell{ border-left:0; border-top-width:5px; } }

  /* callouts */
  .box{ border:2px solid var(--text); background:var(--panel); padding:18px 22px; margin:22px 0 0; }
  .box h4{ font-size:15px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:8px; }
  .box p:last-child, .box ul:last-child{ margin-bottom:0; }
  .box ul, .box ol{ margin:0 0 12px; padding-left:22px; max-width:70ch; }
  .box li{ margin-bottom:6px; }
  .stops{ border:2px solid var(--bad); border-left-width:8px; background:var(--panel); padding:16px 22px 14px; margin:22px 0 0; }
  .stops h4{ font-size:15px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--bad); margin-bottom:8px; }
  .stops ol{ margin:0 0 6px; padding-left:22px; max-width:70ch; }
  .stops li{ margin-bottom:6px; }
  .stops p:last-child{ margin-bottom:0; }

  /* tables */
  .tscroll{ overflow-x:auto; border:2px solid var(--text); background:var(--panel); margin-top:20px; }
  table.tb{ border-collapse:collapse; width:100%; font-size:16px; line-height:1.45; }
  .tb th{ text-align:left; padding:10px 14px; border-bottom:2px solid var(--text); font-size:15px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; white-space:nowrap; }
  .tb td{ padding:10px 14px; border-top:2px solid var(--line-strong); vertical-align:top; }
  .tb tr:first-child td{ border-top:0; }
  .tb td:first-child{ font-weight:700; }
  .tb .mo{ font-family:var(--mono); font-size:15px; white-space:nowrap; }

  /* contents */
  .toc{ list-style:none; margin:20px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:10px; }
  .toc a{ display:flex; align-items:center; gap:12px; padding:8px 12px; border:2px solid var(--line-strong); background:var(--panel); color:var(--text); text-decoration:none; font-size:16px; font-weight:700; min-height:48px; }
  .toc a:hover{ border-color:var(--text); }
  .toc b{ display:grid; place-items:center; width:30px; height:30px; flex:none; background:var(--text); color:var(--bg); font-size:16px; }

  /* read next */
  .next{ display:grid; gap:14px; grid-template-columns:1fr; margin-top:56px; }
  @media (min-width:760px){ .next{ grid-template-columns:1fr 1fr; } }
  .next a{ display:grid; gap:4px; padding:16px 20px; border:2px solid var(--text); background:var(--panel); color:var(--text); text-decoration:none; }
  .next small{ font-size:15px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--accent-ink); }
  .next b{ font-size:20px; }
  .next span{ font-size:16px; color:var(--text-2); line-height:1.4; }
  .next a:hover{ border-color:var(--accent); }
  .foot{ margin-top:56px; border-top:2px solid var(--text); padding:20px 0 28px; font-size:16px; color:var(--muted); }

  /* the svg diagrams: flat fills, thick lines, no effects */
  .defs{ position:absolute; width:0; height:0; overflow:hidden; }
  .dg{ display:block; margin:0 auto; width:100%; min-width:900px; max-width:960px; height:auto; font-family:var(--sans); }
  .dg text{ font-size:17px; fill:var(--text); }
  .dg .nm{ font-size:19px; font-weight:800; }
  .dg .h{ font-size:20px; font-weight:800; }
  .dg .big{ font-size:26px; font-weight:800; }
  .dg .huge{ font-size:34px; font-weight:800; }
  .dg .t{ font-size:17px; }
  .dg .s{ font-size:16px; fill:var(--text-2); }
  .dg .b{ font-weight:800; }
  .dg .m{ font-family:var(--mono); font-size:16px; white-space:pre; }
  .dg .mb{ font-family:var(--mono); font-size:17px; font-weight:700; }
  .dg .mbig{ font-family:var(--mono); font-size:28px; font-weight:700; }
  .dg .tag{ font-size:16px; font-weight:800; letter-spacing:0.05em; }
  .dg .mu{ fill:var(--muted); }
  .dg .ac{ fill:var(--accent-ink); }
  .dg .bd{ fill:var(--bad); }
  .dg .wn{ fill:var(--warn); }
  .dg .on, .dg .onx{ fill:var(--on-accent); }
  .dg .bx{ fill:var(--panel); stroke:var(--text); stroke-width:2; }
  .dg .bx.off{ stroke:var(--line-strong); }
  .dg .bx.on{ fill:var(--accent); stroke:var(--accent); }
  .dg .bx.line{ stroke:var(--line-strong); }
  .dg .bx.dash{ stroke-dasharray:9 6; }
  .dg .bx.thick{ stroke-width:3.5; }
  .dg .bx.acc{ stroke:var(--accent); }
  .dg .bx.badb{ stroke:var(--bad); }
  .dg .bx.warnb{ stroke:var(--warn); }
  .dg .bx.dk{ fill:var(--nbx); stroke:var(--nbx); }
  .dg .dkt{ fill:var(--nbx-t); }
  .dg .pn{ fill:var(--panel-2); stroke:var(--line-strong); stroke-width:2; }
  .dg .pn.solid{ stroke:var(--text); }
  .dg .bg{ fill:var(--panel); }
  .dg .n-stated{ stroke:var(--text); }
  .dg .n-guess{ stroke:var(--muted); stroke-dasharray:9 6; }
  .dg .n-said{ fill:var(--accent); stroke:var(--accent); }
  .dg .n-contested{ stroke:var(--warn); stroke-width:3.5; }
  .dg .n-plain{ stroke:var(--muted); }
  .dg .n-bad{ stroke:var(--bad); stroke-width:3.5; }
  .dg .n-ghost{ fill:none; stroke:var(--line-strong); stroke-dasharray:9 6; }
  .dg .n-grey{ fill:var(--panel-2); stroke:var(--line-strong); }
  .dg .ln{ fill:none; stroke:var(--text); stroke-width:2; }
  .dg .ln.dash{ stroke:var(--muted); stroke-dasharray:9 6; }
  .dg .ln.acc{ stroke:var(--accent); }
  .dg .ln.badl{ stroke:var(--bad); stroke-width:3.5; }
  .dg .ln.warnl{ stroke:var(--warn); stroke-dasharray:3 7; stroke-width:3; }
  .dg .ln.mut{ stroke:var(--muted); }
  .dg .ar{ fill:none; stroke:var(--accent); stroke-width:2; marker-end:url(#ah); }
  .dg .ar.thick{ stroke-width:4; }
  .dg .arm{ fill:none; stroke:var(--muted); stroke-width:2; marker-end:url(#ahm); }
  .dg .arb{ fill:none; stroke:var(--bad); stroke-width:2; marker-end:url(#ahb); stroke-dasharray:9 6; }
  .dg .art{ fill:none; stroke:var(--text); stroke-width:2; marker-end:url(#aht); }
  .dg .fillt{ fill:var(--text); }
  .dg .fillb{ fill:var(--bad); }
  .dg .fillw{ fill:var(--warn); }
  .dg .filla{ fill:var(--accent); }
  .dg .fillp{ fill:var(--panel); }
  .dg .curve{ fill:none; stroke:var(--accent); stroke-width:3.5; stroke-linejoin:round; }
  .dg .axis{ fill:none; stroke:var(--text); stroke-width:2; }
  .dg .grid{ fill:none; stroke:var(--line-strong); stroke-width:2; }
  .dg .hl{ fill:var(--accent-soft); stroke:var(--accent); stroke-width:2; }
  .dg .ln.thickl{ stroke-width:4; }
  .dg .pn.badb{ stroke:var(--bad); }
  .mk-a{ fill:var(--accent); } .mk-m{ fill:var(--muted); } .mk-b{ fill:var(--bad); } .mk-t{ fill:var(--text); }
  /* print: light paper, no controls, keep figures whole */
  @media print{
    :root, :root[data-theme="dark"]{ --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F0EB; --text:#000000; --text-2:#222222; --muted:#444444; }
    .theme, .next{ display:none; }
    .fig-scroll{ overflow:visible; }
    .dg{ min-width:0; }
    figure.fig, .box, .stops{ break-inside:avoid; }
  }
</style>
</head>
<body id="top">
<svg class="defs" aria-hidden="true" focusable="false"><defs><marker id="ah" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-a" d="M1 1L15 8L1 15z"/></marker><marker id="ahm" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-m" d="M1 1L15 8L1 15z"/></marker><marker id="ahb" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-b" d="M1 1L15 8L1 15z"/></marker><marker id="aht" viewBox="0 0 16 16" refX="13" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="mk-t" d="M1 1L15 8L1 15z"/></marker></defs></svg>
<header class="mast">
  <div class="wrap mast-in">
    <a class="brand" href="#top"><span>{{SITE_NAME}}</span></a>
    <div class="theme" role="group" aria-label="Colour theme">
      <button type="button" data-theme-set="system" aria-pressed="true" title="Match the system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg><span class="sr">System</span>
      </button>
      <button type="button" data-theme-set="light" aria-pressed="false" title="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg><span class="sr">Light</span>
      </button>
      <button type="button" data-theme-set="dark" aria-pressed="false" title="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4 8.2 8.2 0 1 0 20 14.6z"/></svg><span class="sr">Dark</span>
      </button>
    </div>
  </div>
</header>

<header class="hero wrap" id="top-hero">
  <div class="kicker">{{KICKER}}</div>
  <h1>{{H1}}</h1>
  <p class="lede">{{LEDE}}</p>
</header>

<main class="wrap" id="main">
{{BODY}}
</main>
<footer class="foot"><div class="wrap">{{FOOTER}}</div></footer>
<script>
  // Theme toggle: System follows the OS live; Light and Dark are remembered.
  (function () {
    var root = document.documentElement;
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var btns = document.querySelectorAll('[data-theme-set]');
    var meta = document.querySelector('meta[name="theme-color"]');
    function apply(p) {
      var dark = p === 'dark' || (p === 'system' && !!mq && mq.matches);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.setAttribute('data-theme-pref', p);
      if (meta) meta.setAttribute('content', dark ? '#061B32' : '#F9F6F4');
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-set') === p)); });
    }
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        var p = b.getAttribute('data-theme-set');
        try { localStorage.setItem('{{THEME_KEY}}', p); } catch (e) {}
        apply(p);
      });
    });
    if (mq) {
      var follow = function () { if (root.getAttribute('data-theme-pref') === 'system') apply('system'); };
      if (mq.addEventListener) mq.addEventListener('change', follow); else if (mq.addListener) mq.addListener(follow);
    }
    apply(root.getAttribute('data-theme-pref') || 'system');
  })();
</script>
</body>
</html>
