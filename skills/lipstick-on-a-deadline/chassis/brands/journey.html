<!-- @brand:detect ^$a -->
<!-- @brand:name Journey -->
<!-- @brand:head -->
<meta name="theme-color" content="#0a0c14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2338e0f2' stroke-width='3'/%3E%3C/svg%3E">

<!-- @brand:tokens -->
<style>
  :root, :root[data-theme="dark"], :root[data-theme="light"]{
    color-scheme: dark;
    --bg:#0a0c14; --panel:#121626; --panel-2:#171c30;
    --line:#232a44; --line-2:#1a2036; --line-strong:#39436a;
    --text:#e8ecf6; --text-2:#b9c1d6; --muted:#8a93ab;
    --accent:#38e0f2; --accent-ink:#8cefff; --accent-soft:rgba(56,224,242,0.10); --accent-line:rgba(56,224,242,0.40);
    --on-accent:#041016; --ok:#34d399; --warn:#fbbf24; --bad:#f43f5e;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --serif:"Fraunces", "Iowan Old Style", Georgia, serif;
    --bw:1px; --focus:2px; --shadow:0 20px 60px rgba(0,0,0,0.45);
  }
</style>

<!-- @brand:theme-js -->
<script>document.documentElement.setAttribute('data-theme', 'dark')</script>

<!-- @brand:switcher-css -->
<style>
  .mast{ border-bottom:var(--bw) solid var(--line-2); }
  .mast-in{ display:flex; align-items:center; gap:16px; min-height:60px; }
  .brand{ display:inline-flex; align-items:center; gap:10px; color:var(--text); text-decoration:none; font-weight:600; font-size:17px; }
  .brand svg{ width:22px; height:22px; }
  .views{ margin-left:auto; display:flex; gap:14px; font-size:13px; }
  .views a{ color:var(--muted); text-decoration:none; }
  .views a[aria-current]{ color:var(--text); }
</style>

<!-- @brand:switcher -->
<header class="mast">
  <div class="wrap mast-in">
    <a class="brand" href="#top"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="3"/></svg><span>{{BRAND_NAME}}</span></a>
    <nav class="views" aria-label="Related pages">{{LINKS}}<a href="{{SELF_FILE}}" aria-current="page">{{SELF_LABEL}}</a></nav>
  </div>
</header>

<!-- @brand:end -->
