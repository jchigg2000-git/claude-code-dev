<!-- @brand:theme-js -->
<script>
  // Resolve the theme before first paint: a saved choice wins, otherwise follow the system.
  (function () {
    var p = 'system';
    try { p = localStorage.getItem('tc-theme') || 'system'; } catch (e) {}
    if (p !== 'light' && p !== 'dark') p = 'system';
    var dark = p === 'dark' || (p === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var r = document.documentElement;
    r.setAttribute('data-theme', dark ? 'dark' : 'light');
    r.setAttribute('data-theme-pref', p);
  })();
</script>
<script>
  // Theme toggle: System follows the OS live; Light and Dark are remembered.
  (function () {
    var root = document.documentElement;
    var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    var btns = document.querySelectorAll('[data-theme-set]');
    var meta = document.querySelector('meta[name="theme-color"]');
    function apply(p) {
      var dark = p === 'dark' || (p === 'system' && !!mq && mq.matches);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      root.setAttribute('data-theme-pref', p);
      if (meta) meta.setAttribute('content', dark ? '#061B32' : '#F9F6F4');
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-theme-set') === p)); });
    }
    btns.forEach(function (b) {
      b.addEventListener('click', function () {
        var p = b.getAttribute('data-theme-set');
        try { localStorage.setItem('tc-theme', p); } catch (e) {}
        apply(p);
      });
    });
    if (mq) {
      var follow = function () { if (root.getAttribute('data-theme-pref') === 'system') apply('system'); };
      if (mq.addEventListener) mq.addEventListener('change', follow); else if (mq.addListener) mq.addListener(follow);
    }
    apply(root.getAttribute('data-theme-pref') || 'system');
  })();
</script>

<!-- @brand:switcher-css -->
<style>
  /* ================= masthead: the brand, the three views, the theme (one spec on all three pages) ================= */
  .mast{ border-bottom:var(--bw) solid var(--line-2); }
  .mast-in{ display:flex; align-items:center; gap:16px; min-height:68px; }
  .brand{ display:inline-flex; align-items:center; gap:10px; color:var(--text); text-decoration:none; font-weight:600; font-size:19px; letter-spacing:-0.012em; white-space:nowrap; }
  .brand:focus-visible{ outline:var(--focus) solid var(--accent); outline-offset:4px; border-radius:6px; }
  .tc{ width:30px; height:30px; flex:none; }
  .tc .a{ fill:var(--text); }
  .tc .b{ fill:none; stroke:var(--accent); stroke-width:2.2; }
  /* the three views, read left to right; the one you are on carries the accent rule */
  .views{ display:flex; gap:26px; align-self:stretch; margin-left:6px; padding-left:22px; position:relative; }
  .views::before{ content:""; position:absolute; left:0; top:50%; height:32px; margin-top:-16px; border-left:var(--bw) solid var(--line); }
  .views a{ display:flex; flex-direction:column; justify-content:center; gap:1px; color:var(--muted); text-decoration:none; line-height:1.25; }
  .views b{ font-size:14.5px; font-weight:600; color:var(--text-2); }
  .views small{ font-size:12px; }
  .views a:hover b{ color:var(--text); }
  .views a[aria-current="page"]{ box-shadow:inset 0 -3px 0 var(--accent); }
  .views a[aria-current="page"] b{ color:var(--text); }
  .views a:focus-visible{ outline:var(--focus) solid var(--accent); outline-offset:-2px; border-radius:6px; }
  .theme{ margin-left:auto; display:flex; gap:2px; padding:3px; border:var(--bw) solid var(--line); border-radius:999px; background:var(--panel); }
  .theme button{ display:grid; place-items:center; width:34px; height:30px; border:0; border-radius:999px; background:transparent; color:var(--muted); cursor:pointer; padding:0; }
  .theme button svg{ width:17px; height:17px; }
  .theme button:hover{ color:var(--text); }
  .theme button[aria-pressed="true"]{ background:var(--accent-soft); color:var(--text); box-shadow:inset 0 0 0 var(--bw) var(--accent-line); }
  .theme button:focus-visible{ outline:var(--focus) solid var(--accent); outline-offset:2px; }

  /* lifted from the tc pages' @media (max-width:760px): the views drop to a full-width row */
  @media (max-width:760px){
    .mast-in{ flex-wrap:wrap; gap:0 12px; min-height:0; }
    .brand{ height:58px; font-size:17.5px; }
    .views{ order:3; flex-basis:100%; margin:0; padding:0; gap:0; border-top:var(--bw) solid var(--line-2); }
    .views::before{ display:none; }
    .views a{ flex:1 1 0; min-width:0; align-items:center; text-align:center; padding:9px 2px 10px; min-height:44px; }
    .views b{ font-size:14px; }
    .views small{ font-size:11px; }
  }
</style>
